<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>mageDunegon</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}

		body {
			display: flex;
		}

		#canvas {
			flex: 1 1 auto;
			width: 100%;
			height: 100%;
			display: block;
			outline: none;
		}
	</style>
</head>
<body>
	<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
	<script>
		var Module = {
			canvas: (function() {
				var canvas = document.getElementById('canvas');
				canvas.addEventListener('click', function() { canvas.focus(); });
				canvas.addEventListener('webglcontextlost', function(e) {
					alert('WebGL context lost. Reload the page to continue.');
					e.preventDefault();
				}, false);
				return canvas;
			})()
		};

		(function() {
			var blockedKeys = new Set(['F1', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'Tab']);
			window.addEventListener('keydown', function(ev) {
				if (!blockedKeys.has(ev.key)) { return; }
				var active = document.activeElement;
				var canvas = document.getElementById('canvas');
				if (active === document.body || active === canvas) {
					ev.preventDefault();
				}
			}, { capture: true });
		})();
	</script>
	{{{ SCRIPT }}}
</body>
</html>
